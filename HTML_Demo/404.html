<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Inventory Command - Blueprint Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }
        /* Glassmorphism focus */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #blueprint-canvas {
            cursor: crosshair;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px; /* Grid effect */
        }
        .shelf-rect {
            fill: rgba(56, 189, 248, 0.2);
            stroke: #38bdf8;
            stroke-width: 2;
            transition: fill 0.2s;
        }
        .shelf-rect:hover {
            fill: rgba(56, 189, 248, 0.5);
        }
        #selection-rect {
            fill: rgba(255, 255, 255, 0.1);
            stroke: white;
            stroke-dasharray: 4;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-sky-400">Spatial Inventory Command</h1>
            <p class="text-slate-400 italic">Admin Tool: Click and drag to map new shelves in the stockroom.</p>
        </header>

        <div class="grid grid-cols-4 gap-6">
            <div class="col-span-1 space-y-4">
                <div class="glass p-4 rounded-xl">
                    <h2 class="font-bold mb-2 border-b border-white/10 pb-1">Stats</h2>
                    <p class="text-sm">Shelves Mapped: <span id="shelf-count" class="text-sky-400">0</span></p>
                </div>
                <div class="glass p-4 rounded-xl">
                    <h2 class="font-bold mb-2 border-b border-white/10 pb-1">Instructions</h2>
                    <ul class="text-xs space-y-2 list-disc pl-4 text-slate-400">
                        <li>Left-click and drag to define a shelf area.</li>
                        <li>Hover over a mapped shelf to view details.</li>
                        <li>Click "Save Layout" to log coordinates.</li>
                    </ul>
                </div>
                <button onclick="clearCanvas()" class="w-full py-2 bg-red-500/20 border border-red-500/50 hover:bg-red-500/40 rounded-lg text-sm transition">Clear Blueprint</button>
            </div>

            <div class="col-span-3 glass rounded-2xl overflow-hidden relative shadow-2xl">
                <svg id="blueprint-canvas" width="100%" height="500">
                    <g id="shelves-group"></g>
                    <rect id="selection-rect" x="0" y="0" width="0" height="0" visibility="hidden" />
                </svg>
            </div>
        </div>

        <div class="mt-6 flex justify-end">
            <button onclick="saveLayout(event)" class="px-6 py-2 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded-lg shadow-lg transition disabled:bg-sky-800 disabled:cursor-not-allowed">Save Layout to Database</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('blueprint-canvas');
        const selectionRect = document.getElementById('selection-rect');
        const shelvesGroup = document.getElementById('shelves-group');
        const shelfCountDisplay = document.getElementById('shelf-count');

        let isDragging = false;
        let startX, startY;
        let shelves = [];

        // Mouse Down: Start drawing
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            selectionRect.setAttribute('x', startX);
            selectionRect.setAttribute('y', startY);
            selectionRect.setAttribute('width', 0);
            selectionRect.setAttribute('height', 0);
            selectionRect.setAttribute('visibility', 'visible');
        });

        // Mouse Move: Expand box
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const width = currentX - startX;
            const height = currentY - startY;

            // Handle dragging in any direction
            selectionRect.setAttribute('x', width < 0 ? currentX : startX);
            selectionRect.setAttribute('y', height < 0 ? currentY : startY);
            selectionRect.setAttribute('width', Math.abs(width));
            selectionRect.setAttribute('height', Math.abs(height));
        });

        // Mouse Up: Finalize Shelf
        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            selectionRect.setAttribute('visibility', 'hidden');

            const x = parseFloat(selectionRect.getAttribute('x'));
            const y = parseFloat(selectionRect.getAttribute('y'));
            const w = parseFloat(selectionRect.getAttribute('width'));
            const h = parseFloat(selectionRect.getAttribute('height'));

            // Only save if it's not just a tiny click
            if (w > 10 && h > 10) {
                createShelf(x, y, w, h);
            }
        });

        function createShelf(x, y, w, h) {
            const shelfId = 'shelf_' + Date.now();
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', w);
            rect.setAttribute('height', h);
            rect.setAttribute('class', 'shelf-rect');
            rect.setAttribute('id', shelfId);

            // Add tooltip behavior
            rect.addEventListener('mouseenter', () => {
                console.log(`Hovering over shelf at ${x},${y}`);
            });

            shelvesGroup.appendChild(rect);
            shelves.push({ id: shelfId, x, y, w, h });
            shelfCountDisplay.innerText = shelves.length;
        }

        function clearCanvas() {
            shelvesGroup.innerHTML = '';
            shelves = [];
            shelfCountDisplay.innerText = '0';
        }

        async function saveLayout(event) {
            if (shelves.length === 0) {
                alert("No shelves mapped yet!");
                return;
            }

            const saveButton = event.target;
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';

            try {
                const response = await fetch('operation.php', { // Assumes operation.php is in the same directory
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(shelves),
                });

                const result = await response.json(); // Expect a JSON response from PHP

                if (response.ok) {
                    alert(result.message || 'Layout saved successfully!');
                    clearCanvas(); // Clear the canvas after a successful save
                } else {
                    throw new Error(result.message || 'Failed to save layout.');
                }
            } catch (error) {
                console.error('Error saving layout:', error);
                alert('An error occurred while saving the layout: ' + error.message);
            } finally {
                // Re-enable button
                saveButton.disabled = false;
                saveButton.textContent = 'Save Layout to Database';
            }
        }
    </script>
</body>
</html>
