<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress | LabFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/labflow.jpg">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .bg-crimson-gradient {
            background: linear-gradient(135deg, #ff8c00 0%, #dc143c 100%);
        }
        
        .text-crimson-gradient {
            background: linear-gradient(135deg, #ff8c00 0%, #dc143c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .bg-grid-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Engineering Animation */
        @keyframes gear-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .gear-spin { animation: gear-rotate 8s linear infinite; }
        .gear-spin-reverse { animation: gear-rotate 12s linear infinite reverse; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(220, 20, 60, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }
        .status-pulse { animation: pulse-ring 2s infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        
        .watermark-text {
            -webkit-text-stroke: 2px rgba(203, 213, 225, 0.3);
            color: transparent;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="bg-[#FFF9F8] text-slate-900 overflow-hidden h-screen flex items-center justify-center bg-grid-pattern relative selection:bg-orange-100 selection:text-orange-600">

    <!-- Background Blobs -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-orange-200/40 rounded-full blur-[100px] opacity-60 animate-blob mix-blend-multiply"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-red-200/40 rounded-full blur-[100px] opacity-60 animate-blob animation-delay-2000 mix-blend-multiply"></div>
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] opacity-40 animate-blob animation-delay-4000 mix-blend-multiply"></div>

    <div class="max-w-4xl px-6 text-center relative z-10 flex flex-col items-center">
        
        <!-- Main Visual -->
        <div class="relative mb-2 animate-float">
            <h1 class="text-[10rem] md:text-[16rem] font-black leading-none tracking-tighter text-crimson-gradient select-none drop-shadow-2xl">
                404
            </h1>
        </div>

        <div class="animate__animated animate__fadeInUp relative z-20">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-orange-50 border border-orange-100 text-orange-600 text-[10px] font-black uppercase tracking-widest mb-4 shadow-sm">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                </span>
                System Calibration
            </div>

            <h2 class="text-4xl md:text-6xl font-extrabold mb-3 text-slate-900 tracking-tight leading-tight">
                Under <span class="text-crimson-gradient">Construction.</span>
            </h2>
            
            <p class="text-slate-500 text-lg md:text-xl mb-6 max-w-lg mx-auto leading-relaxed font-medium">
                We're currently laying the foundation for this module. The <b>LabFlow</b> engineering team is hard at work.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-8">
                <a href="landing.html" class="group relative px-8 py-4 bg-slate-900 rounded-2xl leading-none flex items-center divide-x divide-slate-600 overflow-hidden hover:shadow-2xl hover:shadow-slate-900/30 transition-all hover:-translate-y-1">
                    <span class="pr-6 text-slate-100 text-sm font-bold uppercase tracking-widest group-hover:text-white transition-colors">Return Home</span>
                    <span class="pl-6 text-orange-400 group-hover:text-orange-300 transition-colors">
                        <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    </span>
                </a>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full max-w-sm mx-auto glass-card p-5 rounded-3xl animate__animated animate__fadeIn animate__delay-1s border border-white/60">
            <div class="flex justify-between mb-3 items-end">
                <div class="flex flex-col text-left">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Module Status</span>
                    <span class="text-xs font-bold text-slate-700">Frontend Integration</span>
                </div>
                <span class="text-2xl font-black text-crimson-gradient" style="color: #dc143c;">10%</span>
            </div>
            <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-crimson-gradient rounded-full animate__animated animate__slideInLeft relative overflow-hidden" style="width: 10%">
                    <div class="absolute top-0 left-0 bottom-0 right-0 bg-[linear-gradient(45deg,rgba(255,255,255,0.2)_25%,transparent_25%,transparent_50%,rgba(255,255,255,0.2)_50%,rgba(255,255,255,0.2)_75%,transparent_75%,transparent)] bg-[length:1rem_1rem] opacity-30 animate-[pulse_1s_linear_infinite]"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none opacity-30 bg-grid-pattern [mask-image:linear-gradient(to_bottom,transparent,black)]"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-[110] hidden items-center gap-3 bg-slate-900 text-white px-5 py-4 rounded-xl shadow-2xl border border-slate-800 animate__animated animate__fadeInUp">
        <div class="w-8 h-8 bg-green-500/20 rounded-full flex items-center justify-center text-green-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <div>
            <h4 class="font-bold text-sm">Success</h4>
            <p class="text-xs text-slate-400" id="toast-message">Action completed successfully.</p>
        </div>
    </div>

    <script>
        // Check for status param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'created') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            msg.textContent = "Account created successfully!";
            
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.remove('animate__fadeInUp');
                toast.classList.add('animate__fadeOutDown');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 500);
            }, 3000);
        }
    </script>
</body>
</html>
